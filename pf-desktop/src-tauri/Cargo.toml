[package]
name = "app"
version = "0.4.15"
description = "Kivana desktop app"
authors = ["Kostas Jankus"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSSet", "NSString"] }
objc2-app-kit = { version = "0.3.2", features = ["NSButton", "NSCustomTouchBarItem", "NSResponder", "NSTouchBar", "NSTouchBarItem", "NSView", "NSWindow"] }
