name: Build & Publish Release (Basic)

on:
  push:
    tags:
      - "v*.*.*-basic"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (example: v0.4.15-basic)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pf-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm -C pf-desktop ci

      - name: Build (macOS)
        run: npm -C pf-desktop run tauri:build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/macos
          shopt -s nullglob
          cp pf-desktop/src-tauri/target/release/bundle/dmg/*.dmg out/macos/ || true
          cp pf-desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz out/macos/ || true

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: out/macos/*

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pf-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm -C pf-desktop ci

      - name: Build (Windows MSI)
        run: npm -C pf-desktop run tauri:build -- --config src-tauri/tauri.windows.conf.json

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/windows | Out-Null
          Copy-Item -Force pf-desktop/src-tauri/target/release/bundle/msi/*.msi out/windows/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/windows/*

  publish:
    runs-on: ubuntu-latest
    needs: [build_macos, build_windows]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v5
        with:
          name: macos
          path: out/macos

      - uses: actions/download-artifact@v5
        with:
          name: windows
          path: out/windows

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            out/macos/* \
            out/windows/*
